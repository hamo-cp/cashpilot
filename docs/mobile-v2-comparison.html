<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>مقارنة واجهتي CashPilot</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", system-ui, sans-serif; color: #172522; background: #f1efe8; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; }
      main { width: min(100%, 940px); margin: 0 auto; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 8px 0 20px; color: #66736d; }
      .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
      figure { min-width: 0; margin: 0; padding: 12px; border: 1px solid #d9ded6; border-radius: 20px; background: #fffdf8; }
      figcaption { margin: 2px 2px 10px; font-weight: 700; }
      iframe { display: block; width: min(390px, 100%); height: 820px; margin: 0 auto; border: 1px solid #d9ded6; border-radius: 15px; background: #f4f1e9; }
      @media (max-width: 820px) {
        body { padding: 16px; }
        .comparison { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CashPilot: الواجهة الحالية وMobile 2.0</h1>
      <p>المقارنة تعرض مدخلي PWA وAndroid على عرض هاتف واحد.</p>
      <section class="comparison" aria-label="مقارنة الواجهتين">
        <figure>
          <figcaption>واجهة PWA الحالية</figcaption>
          <iframe title="واجهة CashPilot PWA" src="../"></iframe>
        </figure>
        <figure>
          <figcaption>CashPilot Mobile 2.0</figcaption>
          <iframe title="واجهة CashPilot Mobile 2.0" src="../mobile/index.html"></iframe>
        </figure>
      </section>
    </main>
  </body>
</html>
